# 일회용: main 의 youtube-daily 를 지금 한 번 실행한다(이 세션의 GitHub 연동은 수동 실행 권한이 없어 403).
# 2026-11-09 사용자: "그럼 병합하고 오늘 아침에 하려던거 올려 올리고 알려" — 06:37 예약 실행이 돌지 않은 날의 대체 실행.
# GITHUB_TOKEN 의 workflow_dispatch 는 새 실행을 만든다. 끝나면 이 파일을 지운다(main 에는 넣지 않는다).
name: run-daily-now

on:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/run-daily-now.yml"]

permissions:
  actions: write

jobs:
  kick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: youtube-daily 수동 실행(main)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run youtube-daily.yml --ref main -R "$GITHUB_REPOSITORY" -f dry_run=false
