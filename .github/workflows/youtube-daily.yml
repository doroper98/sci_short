# 아침·저녁 업로드 — 하루 두 편을 비공개로 올리고 예약 공개를 건다(publish/youtube.py --daily-next --slot morning|evening).
# 2026-11-08 사용자: "내가 말하지 않아도 제작해서 비공개로 하나씩 올려. 올리는 시간은 아침 7시로 해. 내가 출근하면서 공개로 바꾸게."
# 2026-11-13 사용자: "오 좋다 예약 공개. 어짜피 내가 영상을 다시 맘ㄴ들라고 하는 떄는 이미 올리고 조회수가 낮을때밖에 없어서 예약 공개 좋네.",
#   "아침에도 예약공개로 하자" — 영상은 비공개(privacyStatus private)로 올라가고 status.publishAt 에 건 시각에 유튜브가 공개한다.
#   저녁 편 17:00 KST(사용자 "저녁편 등록 시점을 17시로 바꿀 수 있어?", "사람들이 퇴근길에 볼 수 있도록 노출 하는게 중요할거 같아서 그래."),
#   아침 편 07:00 KST(2026-11-08 "아침 7시"에서 가져온 제작 세션의 제안). 실행이 늦어 그 시각까지 15분이 안 남으면 지금부터 15분 뒤
#   (제작 세션의 제안). 시각·켜고 끄기는 config/daily.json scheduled_publish — 이 파일은 그대로 읽기만 한다.
# 2026-11-13 사용자: "저녁에도 한편 더 올리자." — 하루 두 편(사용자 결정). 아래 자리 배정과 저녁 창은 제작 세션의 제안이다.
# - 아침 창(05~10시 KST): 새 편(config/daily.json 순서), 없으면 다시 올리기 한 편. 48시간 점검은 아침에만 한다.
# - 저녁 창(16~22시 KST — 2026-11-13 사용자 "저녁편 등록 시점을 17시로": 17시 전에 올라와 있게 16시부터): 다시 올리기 한 편(config/republish.json 대기열·48시간 점검 대상). 없으면 쉰다. 새 편은 올리지 않는다.
#   인스타 아침 게시·틱톡 안내는 아침에만(인스타 옛 편은 17시 instagram-evening 이 따로). '예약 공개'('공개 전환 대기') 이슈는 두 자리 모두.
#   config/daily.json evening.enabled 가 false 면 저녁 실행은 쉬고, 아침은 아래 예전 규칙(하루씩 번갈아)으로 돌아간다.
# - 2026-11-10 바뀜: GitHub 예약 실행이 6~10시간씩 늦게 돌아(11-09·10 실측) 매시간 걸고, 아침 창(05~10시 KST)에 돈 실행만 일한다.
#   창 안에서 먼저 돈 실행이 올리고, 나머지는 '최근 6시간 안에 올린 것이 있으면 쉼' 안전장치로 쉰다.
# - 순서: ① (보류 일수가 1 이상일 때만) 최근 그 일수 안에 올린 영상이 아직 비공개면 쉼 — 2026-11-11 사용자 결정으로 0(끔)
#         ② config/daily.json 대기열에서 밤에 만들어 둔 새 편
#         ③ 새 편이 없으면 config/republish.json 다시 올리기 한 편(몰아 공개해 노출을 못 받은 편, docs/CHANNEL_GROWTH.md H3)
#         2026-11-12 사용자 "하루씩 번갈아": alternate_with_new 면 새 편과 다시 올리기를 하루씩 번갈아(하루 한 편 그대로).
#         2026-11-13 부터는 저녁이 켜져 있으면(evening.enabled) 번갈아 올리지 않는다 — 다시 올리기는 저녁 몫.
#         다시 올린 뒤 옛 판은 코드가 비공개로 돌린다(공개 → 비공개만, 토큰에 youtube.force-ssl 필요 — 없으면 경고만).
#         실행마다 먼저 밀린 옛 판 비공개 전환을 다시 시도한다(실패해도 업로드는 그대로).
#         2026-11-13 사용자 "업로드 48시간 지났는데 조회수 50회 미만인 애들은 비공개로 바꾸고 업로드 일정에 다시 넣어서 재업로드":
#         --daily-next 가 맨 먼저 48시간 점검을 한다(config/republish.json auto_sweep, 실패해도 업로드는 그대로).
# - 수동 실행에서 sweep_only 를 켜면 48시간 점검과 밀린 비공개 전환만 하고 기록을 커밋한다(업로드·인스타·틱톡 없음).
# - 올리면 '예약 공개 HH:MM' 이슈가 열린다(할 일 없음 — 시각 변경·취소는 Studio). scheduled_publish 가 꺼져 있으면 예전처럼
#   '공개 전환 대기' 이슈가 열리고 공개는 사용자가 한다. 이 워크플로가 public·unlisted 를 보내거나 올라간 영상을 공개로 바꾸는 일은 없다.
# - 인스타(2026-11-08 사용자 결정 "아침 업로드와 동시에"): 유튜브 단계 직후 한 편을 게시한다(즉시 공개).
#   오늘 유튜브에 올린 편이 먼저, 없으면 아직 인스타에 없는 옛 편. 옛 편은 17시(instagram-evening)에도 한 편씩.
# - 틱톡(2026-11-08 사용자 결정 "반자동: 직접 게시"): 올리지 않는다. 같은 편의 영상 주소·설명을 '공개 전환 대기' 이슈에 넣고
#   사용자가 휴대전화로 올린다(publish/tiktok.py, docs/TIKTOK.md). 유튜브가 쉰 날은 옛 편 하나를 '틱톡 게시' 이슈로.
name: youtube-daily

on:
  schedule:
    - cron: "23 * * * *"           # 매시간. 아침 창 밖이면 gate 에서 바로 끝난다
  workflow_dispatch:
    inputs:
      dry_run:
        description: "검증만 하고 올리지 않음"
        type: boolean
        default: false
      sweep_only:
        description: "48시간 점검(조회수 기준 미만 → 비공개 + 다시 올리기 대상)과 밀린 비공개 전환만 — 올리지 않음"
        type: boolean
        default: false
      slot:
        description: "morning(새 편, 없으면 다시 올리기 · 인스타·틱톡 포함) / evening(다시 올리기 한 편만, 없으면 쉼)"
        type: choice
        options:
          - morning
          - evening
        default: morning

concurrency:
  group: youtube-upload          # 업로드 워크플로와 같은 줄에 세워 기록 커밋이 겹치지 않게
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.w.outputs.go }}
      slot: ${{ steps.w.outputs.slot }}
    steps:
      - id: w
        name: 시간 창 확인(아침 5~10시 · 저녁 16~22시 KST, 수동 실행은 언제나)
        env:
          INPUT_SLOT: ${{ inputs.slot }}
        run: |
          H=$(TZ=Asia/Seoul date +%-H)
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "$H" -ge 5 ] && [ "$H" -lt 10 ]; then
              echo "go=true" >> "$GITHUB_OUTPUT"; echo "slot=morning" >> "$GITHUB_OUTPUT"
            elif [ "$H" -ge 16 ] && [ "$H" -lt 22 ]; then
              echo "go=true" >> "$GITHUB_OUTPUT"; echo "slot=evening" >> "$GITHUB_OUTPUT"
            else
              echo "go=false" >> "$GITHUB_OUTPUT"; echo "시간 창 밖(${H}시 KST) — 쉼" >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            SLOT="${INPUT_SLOT:-morning}"
            if [ "$SLOT" != "evening" ]; then SLOT=morning; fi
            echo "go=true" >> "$GITHUB_OUTPUT"; echo "slot=$SLOT" >> "$GITHUB_OUTPUT"
          fi
  daily:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
      DRY_RUN: ${{ inputs.dry_run }}
      SWEEP_ONLY: ${{ inputs.sweep_only }}
      SLOT: ${{ needs.gate.outputs.slot }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ffprobe 설치
        if: ${{ inputs.sweep_only != true }}
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
      - name: 아침·저녁 한 편 올리기 (비공개 + 예약 공개 07:00·17:00 KST) · 점검만이면 48시간 점검
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          ARGS=(--daily-next --slot "$SLOT" --report upload-report.json)
          if [ "$SWEEP_ONLY" = "true" ]; then ARGS=(--sweep --report upload-report.json); fi
          if [ "$DRY_RUN" = "true" ]; then ARGS+=(--dry-run); fi
          python -m publish.youtube "${ARGS[@]}"
      - name: 인스타 릴스 아침 게시 (즉시 공개)
        if: ${{ always() && inputs.sweep_only != true && needs.gate.outputs.slot != 'evening' }}
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          if [ -z "$IG_ACCESS_TOKEN" ] && [ "$DRY_RUN" != "true" ]; then echo "IG_ACCESS_TOKEN 없음 — 인스타 건너뜀" >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          ARGS=(--next morning --report instagram-report.json)
          while read -r p; do
            if [ -n "$p" ]; then ARGS+=(--prefer "$p"); fi
          done < <(python .github/scripts/uploaded_dirs.py upload-report.json)
          if [ "$DRY_RUN" = "true" ]; then ARGS+=(--dry-run); fi
          python -m publish.instagram "${ARGS[@]}"
      - name: 틱톡 직접 게시 안내 (올리지 않음)
        if: ${{ always() && inputs.sweep_only != true && needs.gate.outputs.slot != 'evening' }}
        run: |
          ARGS=(--next --report tiktok-report.json)
          while read -r p; do
            if [ -n "$p" ]; then ARGS+=(--prefer "$p"); fi
          done < <(python .github/scripts/uploaded_dirs.py upload-report.json)
          if [ "$DRY_RUN" = "true" ]; then ARGS+=(--dry-run); fi
          python -m publish.tiktok "${ARGS[@]}"
      - name: 기록 커밋 (youtube_upload.json · instagram_post.json · tiktok_offer.json)
        if: ${{ always() && env.DRY_RUN != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          MISSING=0
          python .github/scripts/stage_records.py upload-report.json instagram-report.json tiktok-report.json || MISSING=1
          if git diff --cached --quiet; then echo "기록 변경 없음"; exit $MISSING; fi
          MSG="publish: 유튜브·인스타 아침 기록 [skip ci]"
          if [ "$SLOT" = "evening" ]; then MSG="publish: 유튜브 저녁 기록 [skip ci]"; fi
          if [ "$SWEEP_ONLY" = "true" ]; then MSG="publish: 유튜브 48시간 점검 기록 [skip ci]"; fi
          git commit -m "$MSG"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
          exit $MISSING
      - name: 결과 요약 · 예약 공개(공개 전환 대기) 이슈
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/youtube_report.py report upload-report.json instagram-report.json tiktok-report.json
