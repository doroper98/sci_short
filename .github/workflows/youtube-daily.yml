# 아침·저녁 업로드 — 하루 두 편을 비공개로 올리고 예약 공개를 건다(publish/youtube.py --daily-next --slot auto).
# 2026-11-08 사용자: "내가 말하지 않아도 제작해서 비공개로 하나씩 올려. 올리는 시간은 아침 7시로 해. 내가 출근하면서 공개로 바꾸게."(기록)
# 2026-11-13 사용자: "오 좋다 예약 공개. 어짜피 내가 영상을 다시 맘ㄴ들라고 하는 떄는 이미 올리고 조회수가 낮을때밖에 없어서 예약 공개 좋네.",
#   "아침에도 예약공개로 하자" — 영상은 비공개(privacyStatus private)로 올라가고 status.publishAt 에 건 시각에 유튜브가 공개한다.
#   아침 편 06:00 KST(사용자 "그럼 아침 공개는 06시에 공개로 바뀌게 해줘. 이것도 출근길 노출을 노리는거야"),
#   저녁 편 17:00 KST(사용자 "저녁편 등록 시점을 17시로 바꿀 수 있어?", "사람들이 퇴근길에 볼 수 있도록 노출 하는게 중요할거 같아서 그래.").
# - 미리 올리기: cron 은 매시간이지만 GitHub 예약 실행은 실제로 5~9.5시간 간격으로 불규칙하게 돈다(11-10~13 실측). 그래서 좁은 시간
#   창으로는 정각을 맞출 수 없다. 예약 실행은 모두 돌고(slot=auto), 앞 목표 뒤 처음 도는 실행이 다음 목표의 편을 미리 올린다 —
#   아침 편은 보통 전날 저녁·밤, 저녁 편은 낮. 공개 시각은 유튜브가 지키므로 정확하다.
#   목표를 놓쳤으면 목표 뒤 4시간 안의 실행이 지금부터 15분 뒤로 걸어 늦게라도 올린다. 목표마다 기록에 slot_key 를 남겨 한 번만 올린다.
#   한 실행이 늦은 목표 하나와 다음 목표 하나, 두 편을 올릴 수 있다(공개는 몇 시간 떨어진다).
#   유예 4시간·여유 15분·slot_key 방식·자동 실행마다 48시간 점검·인스타/틱톡을 05~10시 실행에만 두는 것은 제작 세션의 제안이다.
#   시각·켜고 끄기는 config/daily.json scheduled_publish — 이 파일은 그대로 읽기만 한다.
# 2026-11-13 사용자: "저녁에도 한편 더 올리자." — 하루 두 편(사용자 결정). 자리 배정은 제작 세션의 제안이다.
# - 아침 목표: 새 편(config/daily.json 순서), 없으면 다시 올리기 한 편. 저녁 목표: 다시 올리기 한 편(config/republish.json 대기열·
#   48시간 점검 대상), 없으면 쉰다. config/daily.json evening.enabled 가 false 면 저녁 목표는 쉬고, 아침은 예전 규칙(하루씩 번갈아).
# - scheduled_publish.enabled 가 false 면 예전처럼: 예약 공개 없이 비공개로만, KST 05~10시 실행은 아침·16~22시 실행은 저녁, 그 밖은 쉼,
#   '최근 6시간 안에 올린 것이 있으면 쉼' 안전장치. 이 시간 창 판단은 publish/youtube.py 가 한다(--slot auto).
#   6시간 안전장치는 예약 공개가 켜져 있을 때도 자리 키가 없는 업로드(병합 push 등)에는 적용된다.
# - 순서: ① 48시간 점검(config/republish.json auto_sweep)과 밀린 옛 판 비공개 전환 — 실행마다 처음에 한 번, 실패해도 업로드는 그대로
#         2026-11-13 사용자 "업로드 48시간 지났는데 조회수 50회 미만인 애들은 비공개로 바꾸고 업로드 일정에 다시 넣어서 재업로드".
#         ② (보류 일수가 1 이상일 때만) 최근 그 일수 안에 올린 영상이 아직 비공개면 쉼 — 2026-11-11 사용자 결정으로 0(끔)
#         ③ 맡을 목표마다 그 자리의 한 편. 다시 올린 뒤 옛 판은 코드가 비공개로 돌린다(공개 → 비공개만, youtube.force-ssl 필요).
# - 수동 실행: slot 기본 auto(예약 실행과 같음). morning·evening 을 고르면 그 자리 한 편(예약 공개 시각은 그 자리의 오늘 시각,
#   지났으면 지금부터 15분 뒤). sweep_only 를 켜면 48시간 점검과 밀린 비공개 전환만 하고 기록을 커밋한다(업로드·인스타·틱톡 없음).
# - 올리면 '예약 공개 HH:MM' 이슈가 열린다(할 일 없음 — 시각 변경·취소는 Studio). 아침 편 알림은 올린 때(흔히 전날 저녁) 온다.
#   scheduled_publish 가 꺼져 있으면 예전처럼 '공개 전환 대기' 이슈가 열리고 공개는 사용자가 한다.
#   이 워크플로가 public·unlisted 를 보내거나 올라간 영상을 공개로 바꾸는 일은 없다.
# - 인스타(2026-11-08 사용자 결정 "아침 업로드와 동시에")·틱톡 안내: 아침 쪽 실행(예약 실행이 KST 05~10시에 시작했거나, 수동 실행에서
#   slot 이 evening 이 아님)에서만 한다. 인스타는 게시 즉시 공개라 아침에 나가야 하는데, 아침 편 유튜브 업로드는 전날 밤에 있을 수 있다.
#   그런 실행에서 이번에 올린 편이 없어도 publish.instagram --next morning 이 유튜브 기록이 있고 인스타에 없는 아침 대기열 편을 고른다.
#   05~10시에 시작한 예약 실행이 하루도 없으면 그날 인스타 아침 게시는 건너뛴다(17시 instagram-evening 과 다음 아침은 그대로).
# - 틱톡(2026-11-08 사용자 결정 "반자동: 직접 게시"): 올리지 않는다. 같은 편의 영상 주소·설명을 이슈에 넣고
#   사용자가 휴대전화로 올린다(publish/tiktok.py, docs/TIKTOK.md). 유튜브가 쉰 날은 옛 편 하나를 '틱톡 게시' 이슈로.
name: youtube-daily

on:
  schedule:
    - cron: "23 * * * *"           # 매시간으로 걸지만 실제로는 5~9.5시간 간격. 예약 실행은 모두 slot=auto 로 돈다
  workflow_dispatch:
    inputs:
      dry_run:
        description: "검증만 하고 올리지 않음"
        type: boolean
        default: false
      sweep_only:
        description: "48시간 점검(조회수 기준 미만 → 비공개 + 다시 올리기 대상)과 밀린 비공개 전환만 — 올리지 않음"
        type: boolean
        default: false
      slot:
        description: "auto(예약 실행과 같음: 맡을 예약 목표를 미리 올림) / morning(새 편, 없으면 다시 올리기) / evening(다시 올리기 한 편만, 없으면 쉼). evening 이 아니면 인스타·틱톡 포함"
        type: choice
        options:
          - auto
          - morning
          - evening
        default: auto

concurrency:
  group: youtube-upload          # 업로드 워크플로와 같은 줄에 세워 기록 커밋이 겹치지 않게
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.w.outputs.go }}
      slot: ${{ steps.w.outputs.slot }}
      morning_side: ${{ steps.w.outputs.morning_side }}
    steps:
      - id: w
        name: 자리 정하기(예약 실행은 언제나 auto · 인스타·틱톡은 아침 쪽 실행만)
        env:
          INPUT_SLOT: ${{ inputs.slot }}
        run: |
          H=$(TZ=Asia/Seoul date +%-H)
          if [ "${{ github.event_name }}" = "schedule" ]; then
            SLOT=auto
            if [ "$H" -ge 5 ] && [ "$H" -lt 10 ]; then MS=true; else MS=false; fi
          else
            SLOT="${INPUT_SLOT:-auto}"
            case "$SLOT" in auto|morning|evening) ;; *) SLOT=auto ;; esac
            if [ "$SLOT" != "evening" ]; then MS=true; else MS=false; fi
          fi
          echo "go=true" >> "$GITHUB_OUTPUT"
          echo "slot=$SLOT" >> "$GITHUB_OUTPUT"
          echo "morning_side=$MS" >> "$GITHUB_OUTPUT"
          echo "자리 $SLOT · 아침 쪽(인스타·틱톡) $MS · ${H}시 KST" >> "$GITHUB_STEP_SUMMARY"
  daily:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
      DRY_RUN: ${{ inputs.dry_run }}
      SWEEP_ONLY: ${{ inputs.sweep_only }}
      SLOT: ${{ needs.gate.outputs.slot }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ffprobe 설치
        if: ${{ inputs.sweep_only != true }}
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
      - name: 예약 목표 미리 올리기 (비공개 + 예약 공개 06:00·17:00 KST) · 점검만이면 48시간 점검
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          ARGS=(--daily-next --slot "$SLOT" --report upload-report.json)
          if [ "$SWEEP_ONLY" = "true" ]; then ARGS=(--sweep --report upload-report.json); fi
          if [ "$DRY_RUN" = "true" ]; then ARGS+=(--dry-run); fi
          python -m publish.youtube "${ARGS[@]}"
      - name: 인스타 릴스 아침 게시 (즉시 공개)
        if: ${{ always() && inputs.sweep_only != true && needs.gate.outputs.morning_side == 'true' }}
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          if [ -z "$IG_ACCESS_TOKEN" ] && [ "$DRY_RUN" != "true" ]; then echo "IG_ACCESS_TOKEN 없음 — 인스타 건너뜀" >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          ARGS=(--next morning --report instagram-report.json)
          while read -r p; do
            if [ -n "$p" ]; then ARGS+=(--prefer "$p"); fi
          done < <(python .github/scripts/uploaded_dirs.py upload-report.json)
          if [ "$DRY_RUN" = "true" ]; then ARGS+=(--dry-run); fi
          python -m publish.instagram "${ARGS[@]}"
      - name: 틱톡 직접 게시 안내 (올리지 않음)
        if: ${{ always() && inputs.sweep_only != true && needs.gate.outputs.morning_side == 'true' }}
        run: |
          ARGS=(--next --report tiktok-report.json)
          while read -r p; do
            if [ -n "$p" ]; then ARGS+=(--prefer "$p"); fi
          done < <(python .github/scripts/uploaded_dirs.py upload-report.json)
          if [ "$DRY_RUN" = "true" ]; then ARGS+=(--dry-run); fi
          python -m publish.tiktok "${ARGS[@]}"
      - name: 기록 커밋 (youtube_upload.json · instagram_post.json · tiktok_offer.json)
        if: ${{ always() && env.DRY_RUN != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          MISSING=0
          python .github/scripts/stage_records.py upload-report.json instagram-report.json tiktok-report.json || MISSING=1
          if git diff --cached --quiet; then echo "기록 변경 없음"; exit $MISSING; fi
          MSG="publish: 유튜브·인스타 아침 기록 [skip ci]"
          if [ "$SLOT" = "evening" ]; then MSG="publish: 유튜브 저녁 기록 [skip ci]"; fi
          if [ "$SLOT" = "auto" ]; then MSG="publish: 유튜브 업로드 기록 [skip ci]"; fi
          if [ "$SWEEP_ONLY" = "true" ]; then MSG="publish: 유튜브 48시간 점검 기록 [skip ci]"; fi
          git commit -m "$MSG"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
          exit $MISSING
      - name: 결과 요약 · 예약 공개(공개 전환 대기) 이슈
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/youtube_report.py report upload-report.json instagram-report.json tiktok-report.json
