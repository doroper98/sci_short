# 인스타 17시 게시 — 이미 유튜브에 있는 옛 편을 하루 한 편 더 올린다(아침 youtube-daily 와 합쳐 하루 두 편).
# 2026-11-08 사용자: "인스타가 유튜브 보다 늦게 시작 했으니, 하루에 두개, 즉 7시, 17시에 하나씩 올리고,
#   유튜브와 속도가 같아지면(즉 유튜브가 올렸던 항목들을 다 올리게 된 시점) 그뒤론 아침 7시 업로드 1회만 실시하는걸로 하자"
# - 16:57 KST 시작(예약 실행 지연 감안). 아직 인스타에 없는 편이 없으면 쉰다 → 따라잡은 뒤에는 아침 1회만 남는다.
# - 인스타는 게시 즉시 공개다. 실패하면 instagram-alert 이슈(저장소 주인 할당).
name: instagram-evening

on:
  schedule:
    - cron: "57 7 * * *"          # 16:57 KST
  workflow_dispatch:
    inputs:
      dry_run:
        description: "검증만 하고 게시하지 않음"
        type: boolean
        default: false

concurrency:
  group: youtube-upload          # 업로드 워크플로들과 같은 줄에 세워 기록 커밋이 겹치지 않게
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  evening:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ffprobe 설치
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
      - name: 옛 편 한 편 게시 (즉시 공개)
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          if [ -z "$IG_ACCESS_TOKEN" ] && [ "$DRY_RUN" != "true" ]; then echo "IG_ACCESS_TOKEN 없음 — 건너뜀" >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          ARGS=(--next evening --report instagram-report.json)
          if [ "$DRY_RUN" = "true" ]; then ARGS+=(--dry-run); fi
          python -m publish.instagram "${ARGS[@]}"
      - name: 기록 커밋 (instagram_post.json)
        if: ${{ always() && env.DRY_RUN != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          MISSING=0
          python .github/scripts/stage_records.py no-youtube-report.json instagram-report.json || MISSING=1
          if git diff --cached --quiet; then echo "기록 변경 없음"; exit $MISSING; fi
          git commit -m "publish: 인스타 17시 게시 기록 [skip ci]"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
          exit $MISSING
      - name: 결과 요약 · 실패 이슈
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f instagram-report.json ]; then python .github/scripts/youtube_report.py ig-report instagram-report.json; fi
